name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: businessos
          POSTGRES_DB: businessos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U businessos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://businessos:businessos@localhost:5432/businessos_test?schema=public
      DATABASE_URL: postgresql://businessos:businessos@localhost:5432/businessos_test?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-not-for-production-use-only
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w backend
      - run: npm run test -w frontend
